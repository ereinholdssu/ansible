---
- name: Install NCPA and configure
  hosts: all
  become: true
  vars:
    nagios_repo_rpm:
      "8":  https://repo.nagios.com/nagios/8/nagios-repo-8-2.el8.noarch.rpm
      "9":  https://repo.nagios.com/nagios/9/nagios-repo-9-2.el9.noarch.rpm
      "10": https://repo.nagios.com/nagios/10/nagios-repo-10-1.el10.noarch.rpm
    ncpa_token: "Nagk2F@hVr3Ls6Tq8Xj@#SSU"

  tasks:
    - name: Import Nagios GPG key
      ansible.builtin.command: rpm --import https://repo.nagios.com/GPG-KEY-NAGIOS-V3
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Install Nagios repo
      ansible.builtin.command: dnf install -y {{ nagios_repo_rpm[ansible_distribution_major_version] }}
      register: repo_install
      changed_when: "'Nothing to do' not in repo_install.stdout"
      when: ansible_os_family == 'RedHat'

    - name: Install NCPA
      ansible.builtin.dnf:
        name: ncpa
        state: present
        update_cache: true
      when: ansible_os_family == 'RedHat'

    - name: Set community string in ncpa.cfg
      ansible.builtin.replace:
        path: /usr/local/ncpa/etc/ncpa.cfg
        regexp: '^community_string = .*'
        replace: "community_string = {{ ncpa_token }}"
      no_log: true
      notify: Restart NCPA

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check if firewalld is installed
      ansible.builtin.package_facts:

    - name: Ensure firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
      when: "'firewalld' in ansible_facts.packages"

    - name: Manage firewall ports via shell commands
      ansible.builtin.shell: >
        firewall-cmd --zone=public --add-port=5693/tcp --permanent && firewall-cmd --reload
      when: "'firewalld' in ansible_facts.packages"

  handlers:
    - name: Restart NCPA
      ansible.builtin.service:
        name: "{{ 'ncpa' if 'ncpa.service' in ansible_facts.services else 'ncpa_listener' }}"
        state: restarted
        enabled: true